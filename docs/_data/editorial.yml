# 社説（縦組みコラム）
title: "終わる企画、始まる企画、変わらぬ場所 ── 8月18日"
body: "昨日8月17日、学マスは新ガシャシリーズ「グラビアガシャ」第1弾（月村手毬）と水着アナザーガシャ、新ストーリーイベント「夏風ワンピース」を一斉に開幕させた。新機能「360°ライブ」と新ロケーション「スタジオ（海辺）」も同時実装、ハッシュタグ投稿キャンペーンも始動と、夏の折り返しにふさわしい大型更新となった。シンデレラガールズでは、8月27日開幕のTOPPA!!!BASE「バトルゲームワールド」の対象6アイドルが判明し、寿屋とのコラボPOP UP「A MAGICAL CHEERS」も新たに発表された。「Pop'n ToyBox!!」はコメント付きアーカイブ配信で千秋楽の熱気を再びファンに届け、SideM「knick-knacks Vol.1」は抽選結果発表で開幕への秒読みに入った。vα-livでは上水流宇宙のバースデーライブが9月に決定し、7月のIWSF2026関連企画は昨日でひとつの区切りを迎えている。そして本日8月18日、総選挙2026 POP UPショップの跡地には「オフィシャルショップ出張所」が新たに開幕した。ひとつの企画が幕を引いても、同じ場所に次の列ができる。夏の終わりが近づくほど、紙面はにぎやかになっていく。そして本日はミリオンライブ！の矢吹可奈、シンデレラガールズの首藤葵が誕生日を迎える。"
