# 社説（縦組みコラム）
title: "765プロ、東京千秋楽で3都市ツアー完走 ── 8月28日"
body: "765プロ「dual twin live tour」は、大阪・名古屋を経て迎えた東京公演の最終日、本日8月28日のZepp Haneda「つみまつよるまち」をもって全6公演のツアーを完走する。昨日8月27日のDAY1「ふたごぼしのつばさ」に続く2日間で、8月6日の大阪初日から3週間あまりを駆け抜けたことになる。合同ライブ「CLASH M@TCH!!」も昨日、チケット価格帯（一般指定席15,000円〜）と出演声優の一部（大橋彩香がDAY2出演）が判明し、来年2月への期待がじわりと膨らんできた。シャニマス「Still blue」はアソビストア一般会員先行の受付が昨日始まり、ミリシタは新シリーズをミリオンラジオでティザー公開するなど、各ブランドとも秋以降を見据えた仕込みが着々と進む一日となった。本日はSideM 11th STAGEの会場物販抽選受付もスタート、シンデレラガールズの涼宮星花が誕生日を迎える。"
