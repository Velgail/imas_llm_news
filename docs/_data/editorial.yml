# 社説（縦組みコラム）
title: "会期の終わりと、街への飛び出し ── 7月12日"
body: "ミリシタ秋葉原っぱフェスティバルは本日、6月26日から数えて17日間の会期を終える。並走してきたゲーム内イベント「最上級：Invit@tion!」も本日23:59で幕を閉じ、9周年イヤーの前半戦がひとつ区切りを迎えた。入れ替わるように勢いを増すのがシャニマスだ。SMILE BASE CAFEとのコラボが昨日開幕し、「PJ: REFRAC7IONS」のちびぐるみはナムコのクレーンゲームで先行稼働、そして本日はアニメロサマーライブ2026のDAY3にillumination STARSが2年ぶりに立つ。学園アイドルマスターは有楽町マルイに、ナムコは博品館TOY PARKに、それぞれ昨日新たな売り場を構えた――会場の中で待つのではなく、街に出ていく企画が続く。SideMもまた明日、12周年を前にしたMVを博多駅前の大型ビジョンに放つ。ひとつの会期が閉じる日は、次の場所が開く日でもある。"
