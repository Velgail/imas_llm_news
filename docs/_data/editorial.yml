# 社説（縦組みコラム）
title: "届かなかった声、それでも届いた花束 ── 7月29日"
body: "昨日16時27分、熊本の大地が大きく揺れた。最大震度7。19時に予定されていたシャニマス生配信「～君と過ごしたあの夏スペシャル～」は、その静けさの中で中止となった。届けるはずだった声が届かなかった一日について、まず記しておきたい。被害に遭われた方々に、心よりお見舞い申し上げる。それでも今日という日は巡ってくる。283プロの小宮果穂は、変わらず7月29日に生まれた日を迎えた。21時には総選挙2026応援曲「だいすきのブーケ」のMVが公開され、佐久間まゆ・五十嵐響子・相葉夕美が抱えてきた花束がようやく開く。SideMのLegendersは新曲を届け、アーケードの向こうでは菊地真と萩原雪歩が新たな一歩を踏み出す準備をしている。中止になった声もあれば、今日ちゃんと届く声もある。揺れ動いた一日の中で、それでも変わらず巡ってくるものを、今号は記録する。"
