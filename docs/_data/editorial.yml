# 社説（縦組みコラム）
title: "月を見上げる千早、少し遅れて届く記憶 ── 9月25日"
body: "昨日、765プロダクションの如月千早がマクドナルドの新CMで「今度いつきみに会えるのかな」を歌った。見上げた先にあったのは、秋の月。同じ昨日18時、岩手の夜に鳴り響いた新曲二曲の記憶も、代々木で交わされた二夜の言葉も、それぞれアーカイブという形でようやく手元に届いた。現地に居合わせられなかった者にも、景色は少し遅れて開かれる。ヴイアライヴは来年、愛知と東京という二つの街で声を届けると発表し、本日はナムコとパズル&ドラゴンズという二つの場所で、それぞれ新しい出会いが同時に始まる。届く先が増えるほど、物語はどこまでも広がっていく。"
