# 社説（縦組みコラム）
title: "3年ぶりの総選挙、静かに幕を閉じる ── 9月18日"
body: "8月3日正午に投票が始まったシンデレラガール総選挙2026が、本日23:59に投票を締め切る。前回「Stage for Cinderella」から約3年ぶりとなった今回は、約190名という大所帯を対象に投票券獲得ミッションや全国61箇所のチェックインスポット、渋谷での特別展示など、これまでにない規模の集票施策が展開されてきた。中間発表のないまま迎える締切だけに、上位7名がソロアルバム化される「新シンデレラガール」の行方はまだ誰にも分からない。一方で明日はミリオンライブ！14thLIVEが国立代々木競技場で開幕、一番くじ「学園アイドルマスター Part6」も発売を迎えるなど、次のヤマ場もすぐそこまで迫っている。昨日実装されたTOURS「S1弾Ex」で周防桃子がゲームセンターの舞台にも進出するなど、フランチャイズ全体の裾野は日ごとに広がり続けている。"
