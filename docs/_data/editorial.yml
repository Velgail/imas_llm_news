# 社説（縦組みコラム）
title: "幕が下りて、次の幕が上がる ── 9月21日"
body: "二日間、国立代々木競技場を沸かせた「14thLIVE」が昨日、ダブルアンコールという誰も読めなかった一手で幕を下ろした。二次会シーンからの暗転、客席通路の練り歩き、そして「春風満帆スターティング」。物語を締めくくるはずの場面で、会場はむしろ次の物語への扉を開けられた気分だったに違いない。その扉の先には、早くも来年6月のKアリーナ横浜が見えている。ミリシタ10周年という節目に、765 MILLIONSTARSがどんな舞台を用意するのか、想像するだけでまだ気は早いけれど心は急いてしまう。同じ日、学園アイドルマスターは篠澤広「め」に映像という新しい衣を着せ、シャニマスは秋葉原の一角で「もしもの未来」を陳列し続けている。明日は上海に、シリーズを越えた新しい店の扉が開く。ひとつの幕が下りるたびに、どこかで次の幕が静かに上がっている。それを見届けるのが、この紙面の役目なのだと思う。"
