# 社説（縦組みコラム）
title: "千秋楽で開いた新章、315プロの「次の10年」 ── 9月14日"
body: "昨日、SideM 11th STAGE ～EVER EVER＠FTER～はTOYOTA ARENA TOKYOでDAY2を迎え、2日間の千秋楽を飾った。「これからもアイマスですよ！」という恒例の締めくくりに続いて舞台上で明かされたのは、シリーズ史上初となる家庭用ゲーム化と、劇場版「F＠NTASTIC BATTLE FES ～Who goes first～」11月20日公開という二つの大型プロジェクト。11年という歳月を経てなお、315プロダクションの物語は新しい扉を開け続けている。同じ会場では新ストーリー「CONNECT WITH STAGE!」「CONNECT WITH MUSIC!」、新企画「AJIプロジェクト」も始動が発表され、千秋楽は文字通り「次の10年」への号砲となった。総選挙2026は投票クライマックス展示が閉幕し、投票締切はいよいよ目前。CG×ミリオンライブ合同ライブの先行受付も昨日締め切られ、各ブランドが着々と次の大舞台へ向けて動き出している。本日はシンデレラガールズの姫川友紀、ミリオンライブの最上静香、SideMの円城寺道流が誕生日を迎える。"
