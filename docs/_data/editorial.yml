# 社説（縦組みコラム）
title: "誕生日と星空、遠く離れた場所の同じ一日 ── 7月19日"
body: "本日、765プロの三浦あずさが誕生日を迎えた。8月6日開幕の「dual twin live tour」で歌う新曲「Binary Star」――二つの星、という意味の曲名が、なんだか今日という日にふさわしく思える。昨日は長野県阿智村で、「日本一の星空」を舞台にしたシンデレラガールズとのコラボが開幕し、アナスタシアが毎晩、夏の星座を解説するという。渋谷では対照的に、Shibuya LOVEZの「Lantis DAYZ」が昨日のSideMから本日のノクチルへとバトンを渡した。同じ渋谷の空の下でも、見上げる先はそれぞれ違う。IWSF2026の立見指定席・ステージサイド席の先着受付は、本日23:59で締め切られる。開幕まであと5日。空を見上げる人も、列に並ぶ人も、それぞれの場所で夏を迎えている。"
