# 社説（縦組みコラム）
title: "ツイン主演、二日目の朝 ── 9月20日"
body: "昨日9月19日、国立代々木競技場に響いた「〜夢咲くワンダーミラージュ〜」は、シリーズ初のツイン主演制の幕開けとなった。徳川まつりとエミリー・スチュアートが披露した新曲3曲、なかでも急遽発表されたデュエット「パルティシオン」は会場を大きくどよめかせたという。本日はバトンが馬場このみと百瀬莉緒に渡り、「Blooming Sign」でDAY2の幕が上がる。ひとつの物語が幕を下ろせば、また次が始まる。そんな巡り合わせは他ブランドにも及ぶ。シャニマスは秋葉原UDXで「パラレル回廊」を開き、学園アイドルマスターは新曲「め」にミュージックビデオという新たな衣を着せた。765プロは「はんげつであえたら」の記憶をちびぐるみに縫い込んで未来へ運ぼうとしている。回り続ける舞台の上で、今日もまた誰かの誕生日が静かに祝われている。"
