# 社説（縦組みコラム）
title: "本日づくしの一日 ── 9月5日"
body: "本日9月5日、学マスLIVE TOUR-標-の福岡公演が福岡サンパレス ホテル&ホールで開幕した。福井公演に続く2会場目で、なりすまし・不正転売防止の顔写真登録システムが導入されている。シンデレラガールズ15周年記念ライブ「for your ONE」のアソビストアプレミアム会員最速先行抽選は本日13:00に当落発表、283 PRODUCTION Solo Live Collection -Master ShowPiece-の公式チケットリセールは本日15:00より受付が始まった。シンデレラガールズは北条加蓮が本日誕生日を迎えている。昨日9月4日には学マスで新限定ガシャ「標」（有村麻央・倉本千奈・紫雲清夏）が開始、シャニマスのPOP UP SHOP「パラレル回廊」は入場事前予約の受付をスタートし、学マス×Chugai Grace Caféはメニューの詳細を公開した。SideMの「in ダイバーシティ東京 プラザ」「Teddy's Collection II」の2企画も開幕日を迎えている。ほかにシャニマス収録の「ヴァイスシュヴァルツ オンライン」が東京ゲームショウ2026での試遊出展を発表し、namco中野店のアーケード版アイマス筐体は稼働終了となった。"
