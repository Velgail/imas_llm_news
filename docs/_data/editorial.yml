# 社説（縦組みコラム）
title: "枠の外へ、枠を越えて ── 7月11日"
body: "昨日開幕したSideM衣装展「STAGE COSTUME MUSEUM」とポップアップ「Starlight Dining」は、渋谷とアトレ川崎という「アイマスの中の場所」に人を呼ぶ企画だった。対して本日開催中のアニメロサマーライブ2026 -Messenger-は、シャニマス「illumination STARS」が2年ぶりにアイマスの外のアニソンの祭典に飛び込む舞台で、明日のDAY3出演を待つ空気が漂う。SideMは12周年（7/17）を前に博多駅前広場の大型ビジョンでMV放映を決めた――こちらもファンが待つ場所ではなく、街そのものに飛び出していく試みだ。ミリシタ秋葉原っぱフェスティバルは本日16日目、記念シャンパンの試飲会も開かれ、最終日まで残り1日と数えるほどに近づいた。20周年記念Piano Collectionの収録楽曲アンケートと283プロソロライブのグッズ受付は、いずれも明日が締切。積み重なった小さな選択の一つひとつが、20周年イヤーの後半戦を形づくっていく。"
