# 社説（縦組みコラム）
title: "見返す夜と、開く扉 ── 9月22日"
body: "昨日は「終わり」を見届ける一日だった。14thLIVEのアーカイブがコメント付きで配信解禁され、SideMは11th STAGEの有料アーカイブが静かに受付を終え、学マス福岡公演のアーカイブもまた幕を下ろした。会場の熱狂を一度きりで終わらせず、画面の前で何度でも反芻できるようにする——この「見返す」という営みも、今やライブ文化を支えるもう一つの舞台なのだと思う。そして本日、今度は現実の街に新しい扉が開いた。上海の百聯ZX創趣場に、アイドルマスター・バンドリ！・ラブライブ！が肩を並べる「アニメガールズプロジェクトストア」がグランドオープンし、シリーズの熱量は国境を越えて広がっていく。京王アリーナTOKYOでは283プロのソロライブに向けた物販整理券の当落が本日13:00に発表され、明日には阿智村の星空コラボとコトブキヤくじが、それぞれ静かに幕を閉じる予定だ。見返す夜と、開く扉。過去を惜しみながら、次の扉を開ける手を止めない——それがこの紙面の役目なのだと、今日もまた思う。"
