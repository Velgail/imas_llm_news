# 社説（縦組みコラム）
title: "新ラジオ開局、舞台からゲーム・映画へ広がる315プロの物語 ── 9月15日"
body: "本日20:00、アイドルマスターチャンネルの新ラジオ番組「IM@S RADIO」が初回配信を迎える。パーソナリティは平田宏美さん・若林直美さんの2人、記念すべき第1回はゲストなしの立ち上げ回となるが、隔週火曜日の配信で各ブランドの出演キャストが順次登場する構想だ。一昨日発表されたSideM家庭用ゲームプロジェクトには、昨日もSNSで期待と注文の声が相次ぎ、315プロダクションの物語は舞台からゲーム・映画へと広がりを見せている。ミリオンライブは最上静香のメモリアルフィギュア第一弾が予約開始、アーケード「TOURS」は新シリーズ「S1弾Ex」の実装日が9月17日に決定し周防桃子の参戦も判明した。シャニマス・ヴイアライヴでは本日23:59に複数の受付が締切を迎え、総選挙2026も投票締切まで残り3日と最終盤に入っている。本日はSideMの秋月涼が誕生日を迎える。"
