# 社説（縦組みコラム）
title: "夏を締めくくる最終日ラッシュと、続く新情報 ── 8月30日"
body: "夏の間続いてきたコラボ企画が、本日8月30日に相次いで最終日を迎える。ミリオンライブ！×町田市「#ミリオン町田アートラリー」、シャニマス×カラオケまねきねこ、シャニマス×Admiralコラボスニーカー（なんばマルイ会場）の3企画がそろって会期終了となり、この夏のコラボラッシュもひと区切りとなる。一方で新情報も続く。昨日8月29日には、デレステ10th ANNIVERSARY TOURの福岡公演PV第2弾がプレミア公開され、9月2日発売のBlu-ray BOXに収録されるドキュメンタリーの詳細も判明。ミリシタでは前日誕生日を迎えた菊地真を記念したガシャ・セットが登場したほか、四条貴音×豊川風花の新エピソードも実装された。シャニマスのソロアルバム「HOPEFUL FE@THERS」は3形態・各3,960円で発売されることが分かり、シンデレラガールズは山梨県とのコラボ「やまなし WALK & WANDER」に向けたコラボ歩数計の予約受付も進行中だ。本日はシンデレラガールズの若林智香が誕生日を迎える。"
