# 社説（縦組みコラム）
title: "15周年イヤー、次の一手が続々と ── 9月17日"
body: "昨日はシンデレラガールズの動きが目立った一日だった。伊勢丹・三越と両ブランド揃っての「おせち2027」特設ページ公開に始まり、沖縄「でじます」・青森「はちます」第2弾という2つのご当地コラボを発表、極めつけは15周年記念「THE ORCHESTRA CONCERT」（来年1月11日・12日、パシフィコ横浜）の開催決定と最速先行受付開始だ。11月のKアリーナ横浜公演「for your ONE」に続く、もう一つの15周年記念公演の誕生である。SideMはフィットネスクラブ「ルネサンス」との異色コラボに乗り出し、シャニマスは昨日発売のアルバム『HOPEFUL FE@THERS』の購入者特典グッズ通販を開始、学マスの月村手毬はUnion Creativeから1/6フィギュア化が決定するなど、各ブランドが秋から年明けにかけての企画を着々と積み上げている。本日はアーケード「TOURS」新シリーズ「S1弾Ex」が実装され、ミリオンライブ！の周防桃子が新たな仲間に加わった。総選挙2026の投票締切は明日9月18日23:59に迫る。本日はディアリースターズの17周年記念日でもある。"
