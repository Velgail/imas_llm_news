# 社説（縦組みコラム）
title: "ご当地とアイマスがつながる一日 ── 名古屋・北海道・香港、輪はどこまでも"
body: "今日はご当地企画の発表が相次いだ。名古屋・愛知エリアの周遊企画「でらます」にSideMのDRAMATIC STARSがアンバサダーとして参加、8月から3ヶ月の周遊旅が始まる。北海道では20周年記念マンホール企画「ふたマス!!!!!!」の鹿追町担当が倉本千奈に決定し、設置は8月23日。海外に目を向ければIWSF2026は本日12:00より香港でライブビューイングチケットが発売される。地に足のついたコラボと、世界へ広がるライブ体験が同じ日に並んだのが今日の紙面の面白さだ。手元では秋葉原っぱフェスが8日目を迎え、本日18時からは9周年記念シャンパンの試飲会。シャニマスは樋口円香の新フィギュアが本日13時から予約開始と、こちらも見逃せない一日になった。"
