# 社説（縦組みコラム）
title: "新しい扉と、続いてきた足音と ── TOURSの次章、大阪の幕開け"
body: "今日はシリーズの「これから」を告げるニュースが飛び込んできた。稼働中のアーケード『アイドルマスター TOURS』が新シリーズ「Second Stage」の始動を発表、7月27日には池袋で公開生配信イベントも予定される。20周年イヤーはIWSF2026だけでなく、こうした形でも次の一歩を刻んでいくらしい。一方で、シンデレラガールズミュージカル「DERE of the DEAD」は本日オリックス劇場で大阪公演の幕を開け、ミリオンライブ14thLIVEはチケット先行の当落発表という節目を迎える。秋葉原っぱフェスは9日目、学マスのガシャは9日目と、積み重ねてきた日々もまた確かな歩みだ。新しい挑戦と、続いてきた足音。今日の紙面にはその両方が並んだ。木下ひなたの誕生日を祝う声も、SNSのあちこちから聞こえてくる。"
