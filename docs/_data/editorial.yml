# 社説（縦組みコラム）
title: "夏の終わりに新コラボ、SideM×ジョイポリス第3弾決定 ── 8月31日"
body: "8月最終日の本日、複数の受注・受付企画が締切を迎える。20周年記念CD計5種の事後通販、シャニマス「バースデープレート」第1弾、シャニマス×メガシャキ第1期プレゼント企画とログインボーナス、876プロダクション「vα-liv」上水流宇宙バースデーライブの先行抽選が、いずれも本日で受付終了となる。学マス×シーブリーズのコラボも本日で全企画を終える。夏を彩ったコラボ企画がひと区切りを迎える一方、昨日8月30日にはミリオンライブ！×町田市「#ミリオン町田アートラリー」が全日程を終了。そして新しい動きも飛び込んできた。SideMと東京ジョイポリスのコラボ第3弾「アイドルマスター SideM in JOYPOLIS 3」が9月12日からの開催で発表され、シャニソンでは765プロコラボ第5弾の特別4コマも公開された。SideM姫野かのんの新キャスト・伊能幸輝さんによるお披露目特別生配信は、明日9月1日19時からの実施が近づいている。"
