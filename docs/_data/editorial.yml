# 社説（縦組みコラム）
title: "『ふたマス』新パートナーに袋井市、鹿追町お披露目も盛況 ── 8月24日"
body: "昨日8月23日、北海道鹿追町では「ふたマス!!!!!!」倉本千奈マンホールのお披露目が「しかおいてくてくマルシェ」にあわせて行われ、道の駅前には多くの来場者が列をなした。同日、静岡県袋井市が新たな「ふたマス」連携自治体に決定、担当はシャイニーカラーズの有栖川夏葉で、設置場所は地元名物「クラウンメロン」のモニュメント前と発表されている。シャニマスでは抽選招待制イベント「Karma / Naraku」発売記念トーク＆ミニライブが都内で開催され、配信がなかったぶん当選者によるSNS投稿が反響を呼んだ。シャニマス「バースデープレート」第1弾は対象7名全員のラインナップが確定した。学園アイドルマスターLIVE TOUR「標」は福岡公演の一般発売が始まり、なりすまし・不正転売防止の顔写真登録システムが新たに導入されている。SideMは11th STAGEの新衣装「トランセンデントリルード」ビジュアルを公開、ダイバーシティ東京プラザとのコラボではスタンプラリー詳細も判明した。765プロ「dual twin live tour」は東京公演の開場・開演時刻が確定し、いよいよツアー千秋楽に向けて機運が高まっている。"
