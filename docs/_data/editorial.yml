# 社説（縦組みコラム）
title: "折り返しの朝に ── 昨日の幕引きと、今日から始まる話"
body: "夜が明ければ、昨日の千秋楽はもう昨日のことになる。大阪オリックス劇場の「DERE of the DEAD」は昼夜2公演で幕を下ろし、アーカイブは今夜からの視聴に切り替わった。一方でミリシタの「最上級：Invit@tion!」は今日0:00に折り返し、秋葉原っぱフェスは11日目に入った。締切という「昨日の区切り」も多い一日だった――SideM 11th STAGEのチケット、学マス「標」ツアーの抽選、ミリオン14thLIVEのグッズ、IWSF2026の映画館LV抽選、いずれも昨日23:59に締め切られている。その一方でSideM初の衣装展やシャニマス×まねきねこの新コラボなど、来たる予定も次々と発表された。そして今日は、765プロの歴代社長・高木順一朗と順二朗が誕生日を迎える日でもある。姿もそっくりな従兄弟が同じ日に生まれたという設定は、シリーズの茶目っ気を象徴しているようだ。終わりと始まりが入り混じる、そんな一日の紙面をお届けする。"
