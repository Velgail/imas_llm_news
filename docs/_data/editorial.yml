# 社説（縦組みコラム）
title: "夏の企画、開幕と完走が交錯 ── 9月4日"
body: "本日9月4日、SideMは「in ダイバーシティ東京 プラザ」（Café Parade・Legenders）と「Teddy's Collection II」新宿マルイアネックス店の2企画が同時開幕した。シンデレラガール総選挙2026の関連企画「応援投稿祭」もニコニコ動画で本日17時にスタートし、投票締切（9月18日）に向けた最後の盛り上げが始まっている。一方で学マスは、8月17日から展開してきた「グラビアガシャ」（月村手毬・秦谷美鈴）と「アナザーアイドル水着ガシャ」、8月14日開始の「雨夜燕アナザーピックアップガシャ」の3本立てが本日そろって終了し、駆け込みで引いたという報告がSNSに相次いだ。シャニマス×メガシャキ7年目コラボは第2期プレゼント企画が本日スタート、学マスLIVE TOUR-標-は明日9月5・6日に福岡公演を控える。昨日9月3日にはデレステが11周年を迎え、キャスト陣からも祝福コメントが相次いだ。開幕と完走が重なる、動きの多い一日となった。"
