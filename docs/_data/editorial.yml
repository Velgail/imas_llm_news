# 社説（縦組みコラム）
title: "福井千秋楽はソロ曲総入れ替え、明日は鹿追とシャニマスの新章へ ── 8月22日"
body: "昨日8月21日、学園アイドルマスター LIVE TOUR「標」福井公演はDAY2・千秋楽を迎え、17曲中13曲をDAY1から入れ替える構成で、葛城リーリヤ「いつかのわたし」・姫崎莉波「重なる夜空の痕跡に」の新曲2曲をサプライズ披露した。同日19時にはツアー楽曲を収録するCDシングル「修楽旅行」の予約もスタートしている。SideMは「ダイバーシティ東京プラザ」との新コラボ（9月4日開催）を発表したほか、「11th STAGE」の会場物販・CD情報も公開。シンデレラガールズ「幻夏妖宴市」大阪会場は初日から盛況で入場整理券が配られ、シャニマス30MSは緋田美琴・七草にちか・七草はづきの新パーツを明らかにした。明日8月23日には北海道鹿追町「ふたマス」倉本千奈マンホールのお披露目と、シャニマス「Karma / Naraku」発売記念イベントが控えている。"
