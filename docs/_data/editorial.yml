# 社説（縦組みコラム）
title: "デレ・ミリ合同新発表、本日正午に解禁 ── 8月26日"
body: "シンデレラガールズとミリオンライブ！の公式Xが8月23日から続けてきた「Coming soon」ティザーが、いよいよ本日正午に答え合わせを迎える。両ブランドのキャラクターが掛け合う演出にファンの考察は過熱していたが、詳細は発表を待つのみだ。ほかにも動きは多い。765プロ「dual twin live tour」は明日8月27・28日、Zepp Hanedaでの東京公演を控えツアー完走ムードが最高潮に。シンデレラガールズはTOPPA!!!BASE「バトルゲームワールド」が明日全国一斉開幕、シャニマスは新POP UP「パラレル回廊」（9月20日〜）とソロライブ「Master ShowPiece」（9月26・27日）の配信チケット販売が動き出した。学マスは「グラビアガシャ」が秦谷美鈴の第2弾へ切り替わり、夜には「初星学園放送部」に小鹿なおがゲスト出演する。アイドルマスターチャンネルでは、6年間チャンネルを支えたAPかっしーの卒業配信が本日19時に控える、節目の一日となった。"
