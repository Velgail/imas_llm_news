# 社説（縦組みコラム）
title: "三方対バン、315と283が横浜で相まみえる日 ── 9月13日"
body: "昨日、SideM 11th STAGE ～EVER EVER＠FTER～はTOYOTA ARENA TOKYOでDAY1を完走した。新衣装「トランセンデントリルード」姿での熱演もさることながら、本編の最後に飛び出したのはSideMとシャイニーカラーズ初となる合同対バンライブ「SPARKLE SHOWDOWN」（2027年6月5日・6日、横浜アリーナ）の発表だった。315プロダクションと283プロダクションが同じステージで激突するという構想に、会場もSNSも一斉にどよめいた。同じ日にはLIVE Blu-ray発売やプロデューサーミーティング2027、Mフェス初のテーマソングと、11th STAGEにまつわる発表が立て続けに飛び出す忙しない一日でもあった。東京ジョイポリスとのコラボ第3弾も開幕し、876プロ／ヴイアライヴの上水流宇宙は誕生日バースデーライブを四条貴音らゲストとともに終えた。本日はシンデレラガール総選挙2026「投票クライマックス」特別展示が最終日、シンデレラガールズの南条光と共通の袖屋璃空が誕生日を迎える。"
