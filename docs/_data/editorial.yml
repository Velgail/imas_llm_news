# 社説（縦組みコラム）
title: "9月の幕開け、SideM新キャストお披露目とシャニソン新曲実装 ── 9月1日"
body: "9月最初の紙面は、まず声の話題から。SideM姫野かのんの新キャストに決定した伊能幸輝さんによるお披露目特別生配信が、本日19時からYouTube・ニコニコ生放送で実施される。既存キャスト陣も歓迎のコメントを寄せており、新体制での「もふもふえん」の今後に注目が集まる。8月19日に開幕したコラボカフェ「Royal Chess Lounge」名古屋栄店も本日が最終日で、次は9月12日から心斎橋店へとバトンをつなぐ。昨日8月31日には、シャニソンにイルミネーションスターズの人気曲「FELICE」が予告どおり実装され、9月6日配信の夏楽曲「泡沫に染まる」へと話題が続く。デレステ10thツアー沖縄・福岡公演のBlu-ray BOXは明日9月2日発売、ミリシタは同じく明日19時から10年目の新シリーズを発表する生配信を控えており、今週も新情報が途切れない。本日はシンデレラガールズの松本沙理奈・諸星きらり、SideMの山下次郎が誕生日を迎える。"
