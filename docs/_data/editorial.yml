# 社説（縦組みコラム）
title: "765プロ完走とSideM新キャスト、夏の節目に沸く ── 8月29日"
body: "765プロ「dual twin live tour」は、大阪・名古屋を経て迎えた東京公演が、昨日8月28日のZepp Haneda「つみまつよるまち」をもって全6公演を完走した。8月6日の大阪初日から3週間、双海亜美・双海真美、三浦あずさ・秋月律子の4人が3都市を駆け抜けたことになる。完走にあわせて新曲「北極星をズラしちゃえ！」「Binary Star」のサブスク配信が解禁されたほか、新ラジオ番組「IM@S RADIO」（9月15日スタート、平田宏美・若林直美パーソナリティ）の発表、シャニソン「Song for Prism」への4人のクロスオーバー登場など、続報が相次いだ。一方SideMでは、8月18日に卒業が発表されていた姫野かのん役の後任が、昨日新人声優・伊能幸輝さんに決定。お披露目生配信は9月1日を予定する。本日はミリプロサマー2026「ミリプロリゾート」が秋葉原UDXで開催、283プロソロライブ「Master ShowPiece」の現地チケット一般発売も始まる。ミリオンライブ！の菊地真が誕生日を迎える一日でもある。"
