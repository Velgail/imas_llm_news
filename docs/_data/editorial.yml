# 社説（縦組みコラム）
title: "765×961、対決の火蓋 ── 9月7日"
body: "昨日9月6日正午、2027年7月24日・25日に京王アリーナTOKYOで開催されるxRライブ「765 PRODUCTION × 961 PRODUCTION IDOL ULTIMATE ONCE AND FOR ALL」の公式サイトがオープンし、チケット先行受付（765プロダクションシート／961プロダクションシート別、10月28日23:59締切）が始まった。天海春香と天ヶ瀬冬馬を配したキービジュアルとともに「所属プロダクションを表すアイテム」の着用が呼びかけられ、推しの選択に悩むファンの声がSNSに相次いでいる。学マスLIVE TOUR-標-は昨日、福岡公演がDAY2で千秋楽を迎え、サプライズの新曲2曲が本日0時より配信開始。ツアーは9月22・23日の岩手公演（一般先着は9月9日まで受付中）、11月のKアリーナ横浜ファイナルへと続く。シャニマスは育成イベント「秋のアイドル強化週間」が本日スタート（9月29日まで）。本日はシンデレラガールズの佐久間まゆが誕生日を迎えている。"
