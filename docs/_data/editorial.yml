# 社説（縦組みコラム）
title: "投票の後に来るもの ── 9月19日"
body: "昨日23:59、シンデレラガール総選挙2026の投票が幕を閉じた。応援アートコンテストも同じ時刻に締め切られ、約190名を巡る2ヶ月半にわたる祭りはひとまず区切りを迎えた形だ。結果発表の日程はまだ明かされていないが、静けさが訪れたのも束の間、本日はミリオンライブ！14thLIVEが国立代々木競技場でついに開幕する。シリーズ初のツイン主演制、そして国立代々木競技場での開催という2つの「初」を引っさげての船出だ。学園アイドルマスターは一番くじPart6が店頭に並び、SideMは11th STAGEのアーカイブ上映会でDAY1を追体験する。片方の熱狂が静かに幕を下ろせば、また別の熱狂が幕を開ける。シャニマスが「8番らーめん」という思いがけない相手とコラボを発表したように、フランチャイズは休む間もなく次の話題を連れてくる。"
