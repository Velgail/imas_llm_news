# 社説（縦組みコラム）
title: "折り返しの、もうひとつの顔 ── 8月14日"
body: "昨日8月13日、765プロ「dual twin live tour」は名古屋Zepp Nagoyaで双海亜美・双海真美「ふたごぼしのつばさ」を完走し、全6公演中3公演を終えてツアーは折り返し地点を迎えた。終演後にはXスペースで折り返しを祝う配信も行われ、余韻はそのまま今日へと引き継がれる。本日は三浦あずさ・秋月律子による「つみまつよるまち」が同じ舞台に立つ。同じく本日、シンデレラガールズ「Pop'n ToyBox!!」もDAY2を迎えるが、こちらは昨日の合同編成から一転、昼は「こども」側、夜は「おとな」側と表情を大きく変える二部制。ひとつのツアー・ひとつの公演が、日替わりで異なる顔を見せる――そんな仕掛けが夏の紙面を賑わせている。学マスは本日18:00より生配信「初星学園HR #11」を控え、新ガシャ「水着ガシャ」の詳細が待たれる。明日にはコミックマーケット108も開幕し、夏はまだまだ続く。"
