# 社説（縦組みコラム）
title: "新曲解禁と終幕ラッシュ ── 9月6日"
body: "昨日9月5日、学マスLIVE TOUR-標-福岡公演のDAY1で新曲3曲「Be proud」「神かわいい」「nazonazo」がサプライズ披露され、本日9月6日0時より配信を開始した。公演内では新ガシャ「【ガラクタロード】星南ガシャ」と、十王星南＆藤田ことねの新エピソード「H.I.F編」の実装も予告されている。福岡公演は本日DAY2で千秋楽を迎える。SideMは「11th STAGE ～EVER EVER＠FTER～」の現地チケット一般発売が昨日23:59に受付終了、CDシリーズ「TRANSCENDENT T@LES」の完結を記念したオンリーショップも昨日アニメイト池袋本店で開幕した。シンデレラガールズは「幻夏妖宴市」大阪会場・「JOL Collab Store」・寿屋コラボ「A MAGICAL CHEERS」・総選挙2026「応援投稿祭」の4企画がそろって本日最終日を迎える。シャニマスは新曲「泡沫に染まる」が本日配信開始、20周年ピアノコレクションのCD予約も本日23:59に締め切られる。本日は961プロダクションの黒井崇男・亜夜が誕生日を迎えている。"
