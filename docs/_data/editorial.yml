# 社説（縦組みコラム）
title: "開幕前夜、海の向こうとこちらで灯が重なる ── 7月23日"
body: "20周年イヤーのフィナーレ「IWSF2026」がついに明日、京王アリーナTOKYOで幕を開ける。会場の物販時間もカードフォリオの販売所も出そろい、あとは開演を待つばかり。同じ今日、海を渡った台湾では「第25回漫画博覧会」が開幕し、斑鳩ルカと緋田美琴のキャストが現地のステージに立った。765プロには新たな「ちびぐるみ」の予約が始まり、シルエットの答え合わせは公式の正式発表を待つ宿題として残った。相馬夏美と舞浜歩、誕生日を迎えた二人への祝福も忘れずに。奈良県香芝市を三カ月盛り上げたLegenders雨彦のコラボは静かに幕を閉じ、また次の街へ──アイマスの一年は、こうして途切れることなく続いていく。"
