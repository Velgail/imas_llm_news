# 社説（縦組みコラム）
title: "小さな締切が重なる日 ── 7月8日に向けて"
body: "大きな見出しがない日ほど、紙面の隅々に目を凝らしたくなる。今日は「本日締切」の告知が目立った一日だった。SideM衣装展の7/18〜22入場分チケット、HMV POP UPの等身大パネル抽選、SideM×TUfaveのジュエリー予約、学マス「一緒に暮らすぬい」の受注――いずれも23:59または正午で幕を閉じる。一方で学マスは新たにSuperGroupiesとのコラボ第2弾を発表し、有村麻央・葛城リーリヤ・倉本千奈の腕時計・バッグ・長財布が本日から予約開始となった。ゲーム内に目を移せば、秋葉原っぱフェスは12日目、学マス「GO MY WAY!!」ガシャとシャニマス「iの栖」は、示し合わせたように7月8日という同じ日に終わりを迎える。締切と滑り出しが同居する一日、駆け込みで手を動かすプロデューサーも多かったのではないか。"
