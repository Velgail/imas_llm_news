# 社説（縦組みコラム）
title: "20周年企画の鹿追町マンホールお披露目とシャニマス記念イベント、本日ダブルで開催 ── 8月23日"
body: "昨日8月22日、SideM「11th STAGE」（9月12・13日、TOYOTA ARENA TOKYO）は現地引換チケットの一般発売が正午よりスタート、あわせてASOBI TICKET公式リセールも受付を開始した。シンデレラガールズは8月27日開幕のTOPPA!!!BASE POP UP「バトルゲームワールド」のグッズラインナップ（アクリルスタンド6種・トレーディング缶バッジ・ドットフレークシール）を公開、シャニマス283プロ「Master ShowPiece」は楽屋花・プレゼントの受付方法を案内した。20周年記念の会場限定CD計5種（Pop'n ToyBox!!／IWSF2026）の事後通販受付も始まり、ミリシタは10年目の新シリーズを発表する生配信を9月2日19時に決定。本日8月23日には、北海道鹿追町「ふたマス」倉本千奈マンホールのお披露目と、シャニマス「Karma / Naraku」発売記念イベントが同日開催される。シンデレラガールズ15周年記念ライブの最速先行抽選、総選挙2026開催記念のアニメイト通販フェアもいずれも本日が締切・最終日となる。"
