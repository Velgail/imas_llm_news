# 社説（縦組みコラム）
title: "小さな更新の束 ── 7月15日"
body: "昨日7月14日は、大きな幕が上がる日ではなく、無数の小さな扉が静かに開く一日だった。学園アイドルマスターでは倉本千奈たち6人のリバーシブルマスコット「リバラバ！2」の予約が始まり、SideMのくじは新しい顔ぶれへと切り替わった。町田では路子ゆかりの美術館に工芸作品を巡る仕掛けがひとつ増え、喫茶店のドリンクと並んでふたつの入口が開いた。ミリシタでは9周年の救済チケットが静かに期限を迎え、代わりにプラチナガシャが新しい歌声を運んでくる。シャニマスの漫画は火種を灯し、MOIW2025の円盤にはキャストの手書きの言葉が添えられる特典が動き出した。夜には「#APラウンジ」がIWSF直前特集を届け、これまでの舞台をひとつずつ振り返らせてくれた。派手な発表がなくとも、紙面は今日もいくつもの続きを運んでいる。"
