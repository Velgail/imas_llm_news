# 社説（縦組みコラム）
title: "終わりは、次の始まりの合図 ── 7月27日"
body: "昨日、京王アリーナTOKYOに響いた最終曲は、20年という歳月そのものだった。IWSF2026 DAY3「-KYOUMEI-」、9つの所属から集った15名の声が一つに重なった瞬間、フィナーレは静かに幕を下ろした――はずだった。だがステージは終わらせなかった。「765プロ×961プロ」、新たな対立の物語「IDOL ULTIMATE ONCE AND FOR ALL」が、その場で電撃発表されたのだ。20周年イヤーの締めくくりに用意されていたのは、涙ではなく次への号砲だった。「20周年ありがとう！SP」で振り返られた約2年間の道のりは、昨日をもって過去になった。そして本日、シンデレラガールズの新田美波が19歳の誕生日を迎える。文武両道、何でもできるはずなのに本当にやりたいことが見えなかった彼女がアイドルを選んだように、このシリーズもまた、一つの物語を終えるたびに次の扉を選び続けてきた。台湾の博覧会も、渋谷の衣装展も、今日それぞれの最終日を迎える。閉幕は喪失ではなく、次の頁をめくる合図として、この街に積み重なっていく。"
