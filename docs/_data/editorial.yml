# 社説（縦組みコラム）
title: "バトンは川崎で、開幕は京王アリーナで ── 7月21日"
body: "昨日閉幕したアトレ川崎の「Starlight Dining」は、本日同じ4Fフロアで総選挙2026ポップアップへとそのままバトンを渡した。同じ場所、違う衣装、次の主役。アイマスの現場ではこうした継承がよく起きる。池袋ではチュッパチャプスとのコラボが本日開幕し、京王アリーナTOKYOのIWSF2026は開幕まであと3日に迫った。配信チケットに全景定点オプションが加わり、会場にはdual twin live tourのブースまで出るという。昨日の学マス生放送で雨夜燕の新章が発表され、町田では海の日限定のロコドリンクに行列ができた――大きな祭りの前夜には、小さな盛り上がりが積み重なっている。"
