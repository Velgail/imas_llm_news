# 社説（縦組みコラム）
title: "大阪千秋楽とC.FIRST始動、土曜の紙面は開幕と有終ふたつの顔 ── 8月8日"
body: "昨日、765プロ「dual twin live tour」大阪公演が三浦あずさ・秋月律子「つみまつよるまち」で千秋楽を迎え、2日間の日程を完走した。終演直後には秋月律子役・若林直美による特別スペース配信も実施され、余韻に浸るプロデューサーも多かったようだ。本日はSideMの新ユニットC.FIRSTが「理由あってリリースイベント」で始動、シャニマスはカナダ「Animethon 2026」でシリーズ北米初のライブに臨む。シンデレラガールズの木場真奈美、SideMの舞田類が誕生日を迎えた一日でもあった。明日は星井美希が韓国・ソウルで海外ライブ第2弾に臨む。"
