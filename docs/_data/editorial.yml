# 社説（縦組みコラム）
title: "遠く岩手で生まれた歌 ── 9月23日"
body: "昨日、岩手県のトーサイクラシックホール岩手では、二つの新曲が産声を上げた。秦谷美鈴の「海奏ララバイ」は海と海月をモチーフにしたやさしい調べ、倉本千奈の「ワタシカワイイアヒルノコ」は白鳥や大鷲を見上げながらも前を向くアヒルの子を描く歌劇調の一曲。会場に居合わせたファンだけが受け取れるはずだったサプライズは、本日からのサブスク配信で誰もが聴ける歌になる。同じ頃、東京では14thLIVEのコメンタリー付き同時視聴が二日にわたって開かれ、昨日は徳川まつりとエミリー、本日は馬場このみと百瀬莉緒の声が、映像の向こうから公演を語り直す。阿智村の星空コラボも、横浜・大宮のヨーグルト店のコラボも、コトブキヤくじも、本日それぞれの幕を静かに下ろす。そして本日は、アンティーカの幽谷霧子の誕生日でもある。遠い舞台で生まれた歌が配信という回路を通って手元に届き、終わりゆく催しがまた次の記憶へと変わっていく——そんな一日を、今日も見届けたい。"
