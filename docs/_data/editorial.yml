# 社説（縦組みコラム）
title: "ツアーグッズ続々判明、夏の物販シーズンが本格化 ── 8月25日"
body: "学園アイドルマスター LIVE TOUR「標」は9月5・6日の福岡公演に向け、会場限定グッズのラインナップが判明。765プロ「dual twin live tour」も8月27・28日の東京公演（Zepp Haneda）向けに会場限定CD「Binary Star」やタオル等の物販情報が出そろい、ツアー完走への機運が高まっている。SideMコラボカフェ「Royal Chess Lounge」は名古屋栄店のコラボメニュー・グッズ詳細が明らかになり、9月のダイバーシティ東京プラザ出店ではコラボメニューの一部も判明した。シンデレラガール総選挙2026はスポットチェックインが新たに5箇所追加、TOPPA!!!BASEは店舗別ノベルティが判明するなど、9月の各種イベントに向けた実務的な続報が相次いだ一日となった。明日8月26日には「初星学園放送部」に月村手毬役・小鹿なおがゲスト出演、アイドルマスターチャンネルではAPかっしーの卒業配信も控えている。"
