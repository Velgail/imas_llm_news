# 社説（縦組みコラム）
title: "開幕前夜、動き出す二つの初めて ── 7月9日"
body: "昨夜20時からのIWSF2026続報配信VOL.2は、会場限定CDやキッチンカー出店にまで踏み込んだ「物販＆展示情報」の回だった。20周年イヤーのフィナーレは、当日の過ごし方まで具体的な輪郭を帯びてきている。本日は学マス「LIVE TOUR -標-」ファイナル公演（11月・Kアリーナ横浜）のプレミアム会員抽選結果が判明する日でもあり、福井・福岡・岩手と積み重ねてきたツアーの完走が、少しずつ現実味を帯びてきた。そして明日は、渋谷BEAMのSideM衣装展とアトレ川崎のStarlight Dining（シンデレラガールズ×学マス）が同じ金曜日に開幕する。ジャンルもブランドも異なる二つの「初めて」が、期せずして同日に幕を開けるのは、20周年イヤーならではの巡り合わせかもしれない。カードフォリオの数量限定再販、ローソングッズの予約受付――昨日から続く一つひとつの小さな動きが、次の大きな一日に向けた助走になっている。"
