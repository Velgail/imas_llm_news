# 社説（縦組みコラム）
title: "夏祭りの幕引きと、新しい列の先頭 ── 8月17日"
body: "昨日8月16日、シンデレラガールズxRライブ「Pop'n ToyBox!!」が渋谷LOVEZで千秋楽を迎え、公式がセットリストと告知まとめを公開した。同じ日、「Memory Pict.」第5弾、学マスカードフォリオ第1弾、14thLIVEイベントグッズ事前二次販売、IWSF2026記念グッズと、この夏積み上げてきた受注がまとめて締切を迎えた。765プロ「dual twin live tour」東京公演は一般先着2次発売と当日券販売がスタートし、コミックマーケット108も初日来場者13万人・企業ブース過去最多121社の盛況のうちに全日程を終えた。そして本日8月17日、学マスは現行ガシャ「セミブルー」「冠菊」を10:59で締めくくり、入れ替わりで新ガシャ「グラビアガシャ」第1弾と水着アナザーガシャ、新ストーリーイベント「夏風ワンピース」が幕を開ける。総選挙2026 POP UPショップ（アトレ川崎店）も本日が最終日で、明日には後継の「オフィシャルショップ出張所」が同じ場所に列を作る。ひとつの夏祭りが幕を引くたび、次の列の先頭がもう動き出している。そして本日はシンデレラガールズの関裕美・西島櫂が誕生日を迎える。"
