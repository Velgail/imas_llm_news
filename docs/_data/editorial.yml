# 社説（縦組みコラム）
title: "半年先の声、明日の一歩 ── 7月18日"
body: "本日、新宿マルイアネックスのAnnivroadでシンデレラガールズ15周年記念POP UP SHOPが幕を開けた。ヴァイスシュヴァルツのカードには、15年分の軌跡を背負ったイラストが並ぶ。同じ紙面の片隅では、12月19日・20日に代々木競技場第一体育館で行われるシャニマス新ライブ「Still blue」のチケット先行受付が昨日始まり、浅倉透の出演が新たに判明した。半年近く先の予定がもう動き出している一方、6日後に迫ったIWSF2026はライブビューイングの一般発売が本日10:00に開いた。近い未来と遠い未来が同じ日に交差する――それがこのシリーズの日常なのだと、あらためて思う。765プロの「dual twin live tour」と「Pop'n ToyBox!!」、それぞれの会場限定CDの発売も判明した。歌はまだ誰の耳にも届いていないが、曲名だけが先に紙面を賑わせている。届く日を待つ楽しみもまた、ファンにとっての財産だ。"
