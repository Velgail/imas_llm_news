# 社説（縦組みコラム）
title: "夏の施策が一斉に切り替わる月曜、学マス新ガシャが始動 ── 8月10日"
body: "昨日8月9日は、ソウルに残った星井美希が海外ソロライブ第2弾「THE FUTURE SPOTLIGHT」に臨んだほか、ミリシタではイベント「Destiny」とプレミアムピックアップSRガシャが相次いで幕を閉じ、「野球の日」にちなんだ永吉昴のイラストも公式から投稿された。学園アイドルマスターでは「アイドル強化月間」など夏の施策が本日でひとまず区切りを迎え、入れ替わりで新ガシャ「セミブルー」「冠菊」が本日11時よりスキルカードスキン付きで始動する。明日はシンデレラガールズと新潟市・佐渡市のコラボ「がたます」が開幕予定で、砂塚あきらの地元凱旋に注目したい。"
