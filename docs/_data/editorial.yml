# 社説（縦組みコラム）
title: "開幕前夜、315が三方から動き出す ── 9月11日"
body: "本日はミリオンライブのPOP UP SHOP「オペラセリア」がコトブキヤ秋葉原館で開幕し、ミリシタには双海亜美・桜守歌織のSSRを含む「SONG FOR YOU！ガシャ VOL.78」が15:00に登場した。SideM×Anideal香水の予約は正午にスタート、公式グッズWEB販売も17:00に始まり、池袋の常設ショップ「315!!!SHOP」は猫耳執事テーマで新たな装いに。昨日実装された学マス「H.I.F編」・ガラクタロードフェス星南ガシャは、パラメータ上限引き上げによる圧倒的な性能でファンを驚かせ、雨夜燕の初プライズフィギュアも展開を始めた。そして明日9月12日、TOYOTA ARENA TOKYOでSideM11th STAGE ～EVER EVER＠FTER～がついに開幕する。同じ日には東京ジョイポリスとのコラボ第3弾、コラボカフェ「Royal Chess Lounge」心斎橋店、876プロ／ヴイアライヴ上水流宇宙のバースデーライブまでもが重なり、315プロダクションが三方から動き出す。シンデレラガール総選挙2026も投票クライマックス特別展示を明日に控え、「#CG総選挙アートコンテスト」への応援イラスト投稿がSNSを賑わせている。"
