# 社説（縦組みコラム）
title: "終わりと始まりが交差する日 ── 7月8日"
body: "昨日から予告されていた「同じ日に終わる」ものが、今日はまとめて動いた。学マス「GO MY WAY!!」の藤田ことねガシャは10:59に終わり、11:00には花海佑芽ガシャへと切り替わる。シャニマスのシナリオイベント「iの栖」も11:59で幕を閉じる。SideM衣装展のチケット一般発売（先着）は7/10〜27の全4区分がついに出そろい、本日23:59の締切をもって受付を終える。一方で、この先を見据えた動きも重なった。IWSF2026の続報配信VOL.2は本日20:00からで、20周年フィナーレへの助走がまた一段進む。学マスのプライズ「アクリルジオラマ〜ジョイフルマーチング〜vol.3」も昨日から全国のクレーンゲームに登場している。締切と開幕、終了と継続――今日の紙面は、そのどちらの顔も併せ持つ一日になった。"
