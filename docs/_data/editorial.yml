# 社説（縦組みコラム）
title: "岩手で灯った二つの新しい光 ── 9月24日"
body: "昨日、岩手県のトーサイクラシックホール岩手は、標ツアー岩手公演の千秋楽を迎えた。十王星南の「Roar」は牙を研ぐようなかっこよさを纏った一曲、紫雲清夏の「Private Glitter」は『昨日よりすこしわがままでいい』と背中を押すシティポップ。二晩にわたり披露された計四曲は、本日までにすべて配信で聴けるようになった。会場に居合わせられなかった者にも、公演の記憶は少し遅れて手元に届く。同じ頃、一番くじ学マスPart6はついにオンライン販売へと間口を広げ、明日にはnamcoのクレーンでも新たな出会いが待っている。そして本日は、伊集院惠と桜庭薫、二人の誕生日でもある。一人旅を愛する惠と、姉の形見の詩集を大切にする薫。それぞれの物語がまた一つ歳を重ねる日に、遠い舞台の歌もまた、こうして今日も手元に届く。"
