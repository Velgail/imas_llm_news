# 社説（縦組みコラム）
title: "完走と滑り出し、秋の企画が入れ替わる一日 ── 9月16日"
body: "本日、シンデレラガールズPOP UP SHOP「TOPPA!!!BASE」が本会場の閉幕をもって全会場完走を迎えた。8月27日の全国一斉開幕から3週間、サテライト5店舗を含め駆け抜けた一つの企画が幕を下ろす一方で、SideM×JR東海「旅マス」は前半期間を終えて明日から後半戦へ、アーケード「TOURS」新シリーズ「S1弾Ex」も明日9/17の実装内容が判明するなど、秋の企画が次々と入れ替わりの時期を迎えている。昨日はミリオンライブ！14thLIVE（9/19・20開幕）のチケット一般発売2次が始まり、木下ひなたの壮瞥町りんご大使4年目就任、学マス×namcoのクレーンゲーム連動キャンペーンも発表され、10月に向けた話題も着実に積み上がった。シャニマスは283プロのソロ曲アルバム『HOPEFUL FE@THERS』を本日発売、購入者特典の抽選会も開催中だ。本日はシンデレラガールズの神谷奈緒、961プロダクションの詩花が誕生日を迎える。"
