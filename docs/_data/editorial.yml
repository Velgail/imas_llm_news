# 社説（縦組みコラム）
title: "歌声のバトンを受けて、フィナーレへ ── 7月26日"
body: "昨日のIWSF2026 DAY2「-ZESSYOU-」は、生バンド・生ストリングスの音色に乗せて、各ブランドの歌姫たちが競演する一夜となった。本来交わることのなかった「CRIMSON LOVERS」を樋口円香と斑鳩ルカが歌い継いだ瞬間、会場の空気が変わったという。公演後の「ばくすて！とーく」では、今井麻美・川口莉奈・小鹿なおがその高揚を語り合った。舞台袖では七草にちかが誕生日を迎え、静かな一日の始まりを告げた。そして本日は、アーケード版「THE IDOLM@STER」稼働から数えて21年目の日。20年の物語はいよいよ最終章DAY3「-KYOUMEI-」へ。ダンスに始まり歌声を経て、今度は客席との呼応がこのフェスティバルを締めくくる。誕生日をこの記念日と同じくする奥空心白が、シリーズの新章を担う一人としてその舞台に立つのも、今日という日にふさわしい巡り合わせだろう。"
