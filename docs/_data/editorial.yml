# 社説（縦組みコラム）
title: "ソウルでつながる2日間、765プロとミリオンスターズが響かせた日曜 ── 8月9日"
body: "昨日、765プロダクションとミリオンスターズがそろって韓国・ソウルの音楽フェス「KIMCHIKURA Fes '26」のステージに立った。Machicoは「かっこいい曲が多かった」、平山笑美は「暑くて熱かった」と現地の熱気を伝え、同じ日にはシャニマスがカナダで臨んだシリーズ北米初ライブの一報も重なり、20周年イヤーのアイマスが世界各地で存在感を示した一日となった。本日はそのままソウルに残った星井美希が、海外ソロライブ第2弾「THE FUTURE SPOTLIGHT」に臨む。IWSF2026の同時視聴上映会もDAY2を迎え、学園アイドルマスターでは「アイドル強化月間」がひと区切りとなった。明日は学マスの新ガシャ「セミブルー」「冠菊」がスキルカードスキン付きで開催され、夏の施策が一斉に切り替わる。"
