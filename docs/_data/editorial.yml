# 社説（縦組みコラム）
title: "東京タワーの灯が消えて、京王アリーナの灯が点る ── 7月22日"
body: "東京タワーで3週間灯り続けた「Silky Sparkling Summer Stage」が、本日で幕を閉じる。入れ替わるように、IWSF2026の会場にはミリオン・SideM・シャニマスの垣根を越えた音楽ゲーム「KAMISABI」の出展が決まり、開幕まではあと2日と迫った。学マスでは花海咲季が「ガラクタロード」で新章に挑み、シャニマスはメガシャキとの7年目の約束を交わした。バンダイスピリッツが公開した765プロの「ちびぐるみ」シルエットは、やよいと伊織か──答え合わせは23日、海を越えた台湾でも新しい幕が上がる。"
