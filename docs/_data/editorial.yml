# 社説（縦組みコラム）
title: "大阪DAY2と渋谷・原宿の新規開店ラッシュ、金曜の紙面は開幕続き ── 8月7日"
body: "本日、765プロ「dual twin live tour」大阪公演がDAY2「つみまつよるまち」を迎え、学マス「ハツボシストア」渋谷サクラステージ店、シャニマスPOP UP STORE『Stillness＆Motion』もそれぞれ開幕した。昨日はアーケード版TOURS「Second Stage」が稼働開始し、新要素の全貌も明らかに。シンデレラガールズの向井拓海が誕生日を迎えた一日でもあった。明日はシャニマスがカナダ「Animethon 2026」でシリーズ北米初のライブに臨む。"
