# 社説（縦組みコラム）
title: "本日20時、放課後の続きへ ── 9月9日"
body: "学マス『はつぼし放課後とーく』が本日20:00に配信され、十王星南・藤田ことねの新エピソード「H.I.F編」の詳細がついに明かされる。福岡公演での予告から積み重ねてきたファンの考察も、今夜で一つの区切りを迎えそうだ。標ツアーは岩手公演の一般先着チケットが本日23:59に受付終了、ツアーはファイナルのKアリーナ横浜公演へと駒を進めていく。9月12日・13日開幕のSideM11th STAGEは、差し入れ企画「315デリバリー」の受付詳細が判明し、開幕まで残り3日と迫った。総選挙2026は投票終盤を盛り上げる「投票クライマックス」特別展示が9月12日・13日に開催決定、昨日はミリシタの期間限定イベント「秘密のメモリーズ」も静かに幕を閉じた。本日はシンデレラガールズの栗原ネネ、ミリオンライブの音無小鳥が誕生日を迎えている。"
