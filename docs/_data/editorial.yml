# 社説（縦組みコラム）
title: "ダンスの夜が明けて、次は歌声 ── 7月25日"
body: "昨日のIWSF2026 DAY1「-YAKUDOU-」は、21曲・全出演者による大団円で幕を閉じた。ブランドを超えたキャスティングで歌い踊る姿は、20年という時間がアイドルマスターというシリーズに積み重ねてきたものの厚みを感じさせるものだった。会場の外でも、神谷奈緒や舞浜歩を応援するファン有志の幕がいくつも掲げられ、公式とファンが同じ熱量で一日を作り上げた。舞台の袖では、葛城リーリヤの誕生日を祝う記念グッズと動画が静かに公開され、アトレ秋葉原では765プロの13人が新しい衣装で街を彩り始めた。そして本日、舞台は「生バンド」を掲げるDAY2「-ZESSYOU-」へ。ダンスの熱がまだ冷めやらぬうちに、今度は歌声がこの物語を引き継ぐ。"
