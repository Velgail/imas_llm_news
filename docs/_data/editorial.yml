# 社説（縦組みコラム）
title: "がらくたの先に ── 9月10日"
body: "昨夜の「はつぼし放課後とーく」を経て、十王星南・藤田ことねの新エピソード「H.I.F編」とガラクタロードフェス星南ガシャが、本日11:00についに実装される。福岡公演での予告からおよそ1週間、積み重ねてきたファンの考察が今日ひとつの答えを迎える。標ツアーは岩手公演のチケット受付が一般先着・公式リセールとも出そろって締め切られ、次はファイナルのKアリーナ横浜公演を待つのみ。9月12日開幕のSideM11th STAGEは音楽ゲーム「KAMISABI」の会場販売が決まり、開幕まで残り2日。シャニマスは「283 PRODUCTION Solo Live Collection」の現地物販整理券が本日13:00から、876プロ／ヴイアライヴは「限定オンライン1on1」第13回の抽選が昨日から受付中と、9月後半に向けた仕込みが各所で進む。本日はシンデレラガールズのベテラントレーナーが誕生日を迎えている。"
