# 社説（縦組みコラム）
title: "灯、ついに京王アリーナへ ── 7月24日"
body: "20周年イヤーの総仕上げ「IWSF2026」が、本日ついに京王アリーナTOKYOで幕を開けた。DAY1のテーマは「ダンス」、サブタイトルは「-YAKUDOU-」。星井美希や伊吹翼、紫雲清夏、上水流宇宙ら、ブランドの垣根を越えたアイドルたちが同じ舞台に立つ。会場にはファン有志が仕立てた応援広告や、プロデューサー自らデザインした応援幕も並び、公式とファンが同じ熱量でこの一日を作り上げてきたことがよく分かる。舞台の外でも今日という日は静かに動いていた──学園アイドルマスターの葛城リーリヤが誕生日を迎え、親友である紫雲清夏の晴れ舞台と重なったのは、偶然にしても出来すぎている。20年かけて積み重ねてきた物語が、また一つ、今夜の京王アリーナで新しいページを開く。"
