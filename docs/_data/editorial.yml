# 社説（縦組みコラム）
title: "315が三方から動き出す日 ── 9月12日"
body: "本日、TOYOTA ARENA TOKYOでSideM11th STAGE ～EVER EVER＠FTER～がついに開幕した。機材席の開放に伴い当日券の販売も急遽決定し、駆け込みで参戦を決めたプロデューサーも少なくない。同じ日には東京ジョイポリスとのコラボ第3弾、コラボカフェ「Royal Chess Lounge」心斎橋店も開幕し、315プロダクションがまさに三方から動き出した。876プロ／ヴイアライヴの上水流宇宙は本日誕生日を迎え、記念のバースデーライブには四条貴音・灯里愛夏・レトラという豪華ゲストの出演も直前に判明。シンデレラガール総選挙2026は「投票クライマックス」特別展示が本日・明日の2日間開催され、投票締切まで残りわずかとなった終盤戦を盛り上げる。昨日はミリシタPOP UP SHOP「オペラセリア」が開幕し、学マスは藤田ことねの1/7フィギュア「冠菊Ver.」の予約も始まった。本日はシンデレラガールズの夢見りあむが誕生日を迎えている。"
