# 社説（縦組みコラム）
title: "衣装は畳まれても、花束はまだ蕾のまま ── 7月28日"
body: "昨日、渋谷BEAMの扉が静かに閉じた。SideM史上初の衣装展「STAGE COSTUME MUSEUM」、18日間、約250着のライブ衣装と49人の等身大パネルが見つめてきた景色が、記憶へと畳み込まれていく。同じ昨日、京王アリーナに響いた歓声もまたコメント付きアーカイブという形で瓶詰めにされ、20周年イヤーの物語はこうして幾重にも保存されていく。一方、765プロの高槻やよいと水瀬伊織は、小さな「ちびぐるみ」となって来年1月にもう一度私たちの手元に届くことが確定した。畳まれた衣装がある一方で、まだ開いていない蕾もある。明日21時、総選挙2026応援楽曲第3弾「だいすきのブーケ」のMVが公開される。佐久間まゆ・五十嵐響子・相葉夕美――3人が抱える花束は、まだ誰にも見せていない。投票開始まで残りわずかとなった今、閉じる扉と、開く花。7月28日という一日は、その狭間にそっと置かれている。"
