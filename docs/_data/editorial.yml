# 社説（縦組みコラム）
title: "終わりが重なる日、始まりも重なる ── 7月13日"
body: "昨日7月12日は、いくつもの会期がいっせいに幕を閉じた日だった。アニメロサマーライブ2026はDAY3で千秋楽、シャニマス「illumination STARS」が2年ぶりの大舞台を終えた。ミリシタ9周年「秋葉原っぱフェスティバル」は17日間の会期を終え、並走したゲーム内イベント「最上級：Invit@tion!」も23:59で幕を下ろした。渋谷ではAdmiralコラボスニーカーのPOP UPとPULSE COLLECTIONのPOP UPが、それぞれモディとSHIBUYA109で最終日を迎えている。ひとつの街に複数の「最終日」が重なるのは珍しいが、それだけ7月前半のアイマスが賑わっていた証でもある。そして今日、区切りの翌日にも新しい動きは止まらない。SideMは12周年を前に、博多駅前の大型ビジョンにMVを掲げ始めた。明日にはシャニマスとカラオケまねきねこのコラボが海辺の装いで幕を開ける。シンデレラガールズは氏家むつみの誕生日を迎えた。会期が閉じても、次の場所はもう動き出している。"
