# 社説（縦組みコラム）
title: "終幕と幕開けが重なる日 ── 8月16日"
body: "昨日8月15日、コミックマーケット108が東京ビッグサイトで開幕し、シャニマスは中外鉱業ブースで、学マスはGiftブースでそれぞれ新作グッズを並べた。同じ日、SideM「リメンバーショット」フェア第3弾が全国アニメイトで始まり、シャニマス×Admiralのコラボスニーカーはなんばマルイでファンを迎えた。ミリオンライブは「ミリプロサマー2026」を走らせながら、8月29日の秋葉原UDXでの大型POP UPを予告。そして本日8月16日は、終幕がまとまって訪れる一日だ。「幻夏妖宴市」東京会場、「Pop'n ToyBox!!」、「Stillness＆Motion」がそろって最終日・千秋楽を迎え、ミリシタ×カラオケの鉄人コラボも本日で幕を下ろす。学マスの現行ガシャ「セミブルー」「冠菊」は明日10:59に終了し、新ガシャ「グラビアガシャ」へとバトンが渡る。765プロ「dual twin live tour」は東京公演のチケットが本日締切、シンデレラガールズ15周年イベントのチケットはアソビストアプレミアム会員先行抽選が受付継続中だ。夏の物語がひとつ幕を閉じるたび、次の物語がすぐそこで開演を待っている。そして本日はシャイニーカラーズの有栖川夏葉が誕生日を迎える。"
