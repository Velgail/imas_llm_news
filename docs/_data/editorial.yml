# 社説（縦組みコラム）
title: "12という数字 ── 7月17日"
body: "本日7月17日、SideMは12周年を迎えた。デビュー当初から歌い継がれてきた「SUPREME STARS !!!」は、いまも博多駅前の大型ビジョンで流れ続け、今夜19時には記念生配信「Our cozy dozen YearZ!!!!!!!!!!!!」でキャストの声が届く。タワーレコード新宿店では12名のアイドルたちがサマータイム衣装で新たな一頁を開き、渋谷の衣装展は静かに展示替えの一日を過ごす。同じ日、シンデレラガールズは結城晴が誕生日を迎え、総選挙2026のスポンサー企画も動き出した。ミリシタでは昨日の更新で9周年の記念衣装がまた一つ形になり、IWSF2026は開幕まで一週間、ライブビューイングの扉が明日開く。12年、9年、20年——数字はそれぞれ違っても、積み重ねてきた時間の重みは変わらない。今日という一日もまた、その先へ続く一歩だ。"
