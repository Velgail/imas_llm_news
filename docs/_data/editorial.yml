# 社説（縦組みコラム）
title: "静けさの後の、二つの開幕 ── 8月13日"
body: "昨日8月12日は、公式からの新規発表が目立たない、束の間の凪の一日だった。しかしその静けさは、今日という日のための助走に過ぎない。本日8月13日、シンデレラガールズCONCEPT xR LIVE「Pop'n ToyBox!!」がShibuya LOVEZで開幕する。赤城みりあ・市原仁奈・椎名法子による「Poppin' para Pong!」、高垣楓・三船美優・大和亜季による「Cookie Dough」――ふたつの新曲を携え、16日までの4日間・全6公演で異なる表情を見せる。同じく本日、765プロ「dual twin live tour」は名古屋Zepp Nagoyaで双海亜美・双海真美「ふたごぼしのつばさ」が開幕。8月6日・7日の大阪公演を完走したツアーはいよいよ折り返しを過ぎ、8月27日・28日の東京公演へと歩を進める。夏の盛りに二つの大きな幕が同時に上がる、そんな一日となった。"
