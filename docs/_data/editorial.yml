# 社説（縦組みコラム）
title: "ことねと星南、放課後にそろう ── 9月8日"
body: "学マス『はつぼし放課後とーく』（明日9月9日20:00配信）に、藤田ことね役・飯田ヒカルさんの出演が決定した。既に発表されていた十王星南役・陽高真白さんとの合流で、福岡公演から予告されている新エピソード『H.I.F編』への期待が一段と高まっている。実装は9月上旬〜中旬と見込まれ、二人の物語がどんな決着を迎えるか、放課後の教室に注目が集まる。SideMは本日13:00、11th STAGE会場物販の抽選整理券当落発表を控え、SNSでは結果を待つ声が相次いだ。昨日9月7日に開幕したシャニマス『秋のアイドル強化週間』（9月29日まで）ではユニット編成を巡る議論が早くも白熱。総選挙2026は投票締切（9月18日）まで残り10日となった。本日はシャイニーカラーズの緋田美琴が誕生日を迎えている。"
