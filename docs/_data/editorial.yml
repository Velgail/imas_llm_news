# 社説（縦組みコラム）
title: "デレ・ミリ、来年2月に激突 ── 8月27日"
body: "シンデレラガールズとミリオンライブ！が8月23日から続けてきた「Coming soon」ティザーは、昨日8月26日正午、クロスブランドライブ「CLASH M@TCH!!」（来年2月27・28日、愛知県IGアリーナ）の開催決定という答え合わせを迎えた。ミリオンライブ！側が13年の歴史で初めて弦楽器編成ユニット「MILLION STRINGS」を投入すると知り、ファンの間ではさっそく編成予想が飛び交っている。物販面でもシンデレラガールズ「大好きのブーケ＆すりーぷすきっぷ」、SideM「もふもふえん」の2枚のCDが昨日発売され、シャニマス生配信の内容もようやく判明、新曲「泡沫に染まる」（9月6日配信）とアルバム「HOPEFUL FE@THERS」（9月16日発売）が続く。本日は765プロ「dual twin live tour」がZepp Hanedaで東京公演初日を迎え、大阪・名古屋を経てきたツアーもいよいよ完走目前。シンデレラガールズのTOPPA!!!BASE「バトルゲームワールド」も本会場とサテライト5会場で全国一斉開幕し、紙面は動きの多い一日となった。"
