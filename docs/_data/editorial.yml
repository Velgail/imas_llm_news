# 社説（縦組みコラム）
title: "山の日、新潟が紙面を彩る一日 ── 8月11日"
body: "昨日8月10日は、学マスの新ガシャ「セミブルー」「冠菊」がスキルカードスキンを初実装して始動した一方、既存所持者を中心に賛否の声が広がった。同日始まった「夏休みプロデュースキャンペーン」とあわせ、夏休みらしい施策が重なる一日に。星井美希の韓国ライブ「THE FUTURE SPOTLIGHT」のセットリストが公開されたほか、難波笑美役・伊達朱里紗さんの結婚報告も話題を呼んだ。本日8月11日・山の日は、新潟市・佐渡市とシンデレラガールズのコラボ「がたます」がついに開幕。新潟出身の砂塚あきらの地元凱旋とともに、40箇所を巡るスタンプラリーが始まる。ミリオンライブ14thLIVE・学マスLIVE TOUR「標」ファイナル公演はそれぞれ一般会員先行の当落発表を本日13時に控えており、続報を待ちたい。"
