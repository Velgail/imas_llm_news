# 社説（縦組みコラム）
title: "夏の企画が一区切り、次の幕が上がる ── 8月20日"
body: "昨日8月19日、シャニマスでは7月30日開始の夏スペシャル企画――ジューンブライド特別企画ガシャやストレイライトのシナリオイベント「with open()」など計7コンテンツが11:59で一斉に終了した。約3週間続いた夏の一区切りである。同じ昨日、SideMのコラボカフェ「Royal Chess Lounge」が名古屋栄で開幕し、ミリシタでは新イベント「プラチナスタートラストBOT～Glow Together～」が動き出した。ひとつの企画が幕を下ろせば、また別の企画が動き出す。それがコンテンツを途切れさせない編成というものなのだろう。そして本日8月20日、学園アイドルマスター LIVE TOUR「標」の福井公演が開幕し、シャニマス「ちびぐるみ～Team.Sol～」も展開を開始した。明日8月21日には「幻夏妖宴市」大阪会場・JOL Collab Store「Legend of Cinderella」・寿屋POP UP「A MAGICAL CHEERS」・SideM「knick-knacks Vol.1」と、実に4つのPOP UPが一斉に開幕を控える。夏の終わりが近づくほど、紙面はにぎやかになる。"
