# 社説（縦組みコラム）
title: "物語とグッズが交差する夏 ── 8月15日"
body: "昨日8月14日、765プロ「dual twin live tour」は名古屋Zepp Nagoyaで三浦あずさ・秋月律子「つみまつよるまち」を完走し、全6公演中4公演を終えた。同じ夜、学マスは生配信「初星学園HR #11」で新ガシャシリーズ「グラビアガシャ」（第1弾・月村手毬、新規衣装はワンピースと水着の2着）と新ストーリーイベント「夏風ワンピース」の詳細を明かし、夏の新ラインナップを整えた。ミリシタでは新モード「アイドルグランプリ」が正式オープンし、宮尾美也のプロデュースも解禁。SideMは「THE 虎牙道」の物語を無料開放し、シンデレラガールズは既刊コミックの新装版で読者の裾野を広げた。そして本日8月15日、コミックマーケット108が東京ビッグサイトで開幕する。シャニマスは中外鉱業ブースで新作グッズを本日から販売開始。「Pop'n ToyBox!!」は本日のみ16:00公演1回に絞られ、「幻夏妖宴市」「Stillness＆Motion」はいずれも会期終盤を迎える。ライブ、配信、即売会――形式は違えど、夏の終わりに向けて物語とファンが交差する一日となりそうだ。そして本日はシンデレラガールズのケイトが誕生日を迎える。"
