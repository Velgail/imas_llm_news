# 社説（縦組みコラム）
title: "海の家が閉じ、町の物語が開く ── 7月30日"
body: "昨晩21時、シンデレラガール総選挙2026の応援曲「大好きのブーケ」のMVが公開された。佐久間まゆ・五十嵐響子・相葉夕美の3人が歌うこの曲に、タイムラインは「ヤバすぎてヤバい」の声で埋め尽くされた。8月3日の投票開始を前に、花束はもう十分に開いている。そして本日、季節はまたひとつ区切りを迎える。学マス×スイパラ「Deep Marine Stage」は江ノ島海の家店・神戸店が最終日。夏の始まりに開いた店が、夏の盛りに閉じていく。一方で町田では「#ミリオン町田アートラリー」がまさに本日開幕、ロコゆかりの町を巡る新しい物語が動き出す。閉じる場所があれば、開く場所もある。そんな一日に、シンデレラガールズの城ヶ崎莉嘉が誕生日を迎えた。姉・美嘉とともに歩んできた妹の一日を、今号も静かに記録しておきたい。"
