# 社説（縦組みコラム）
title: "同じ金曜日に幕を開けた二つの「初めて」 ── 7月10日"
body: "本日、渋谷BEAMのSideM衣装展「STAGE COSTUME MUSEUM」とアトレ川崎のポップアップストア「Starlight Dining」（シンデレラガールズ×学マス）が、予告通り同じ金曜日に開幕した。片や10年分のライブ衣装を振り返る回顧展、片や中華風メイド衣装で彩られた合同グッズ展開――ジャンルもブランドもまったく異なる二つの「初めて」が同日に並び立つのは、20周年イヤーならではの豊かさだろう。昨日は「LIVE TOUR -標-」ファイナル公演のグッズ事前販売が始まり、当落発表の余韻の中でSNSにも歓喜の声が広がった。同じ昨日には20周年記念アルバム「Piano Collection」の世界配信も始まっており、シリーズを彩ってきた楽曲群が装いを変えて改めて届けられている。DERE of the DEADの記念グッズ受注、Memory Pict.の新ラインナップ、283Birthday Collectionの新弾――一つひとつは小さな更新でも、積み重なれば紙面を10面以上埋めるだけの厚みになる。明日はミズノスポーツサービスの記念商品発売とフットサル体験会が控えており、総選挙2026に向けた助走もまた続いていく。"
