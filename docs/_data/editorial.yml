# 社説（縦組みコラム）
title: "同じ誕生日、それぞれの物語 ── 7月20日"
body: "本日、シンデレラガールズの龍崎薫と杉坂海が同じ誕生日を迎えた。愛媛と山口、生まれた場所も性格も違う二人が同じ日を分け合う――アイドルマスターらしい偶然だ。川崎では合同ポップアップ「Starlight Dining」が本日最終日を迎え、渋谷ではノクチルが昨日のLantis DAYZ DAY2で3曲を歌い上げた。そしてIWSF2026は、映画館ライブビューイングの入金と現地チケットの公式リセール、二つの締切がそろって本日訪れる。開幕まであと4日、事務手続きの締切もまた、開幕へのカウントダウンの一部になっている。"
