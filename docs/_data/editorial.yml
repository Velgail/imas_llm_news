# 社説（縦組みコラム）
title: "海の向こうへ、海の家へ ── 7月14日"
body: "昨日7月13日は、7月前半の余韻を静かに片づける一日だった。「DERE of the DEAD」の配信アーカイブとチケット販売、振り返りトークラジオがそろって受付を終え、大阪千秋楽から続いた一連の企画にひとつの区切りがついた。一方でミリシタは9周年の熱をそのまま次のガシャへと橋渡しし、24時間配信も止まらない。そして今日、視界は思いがけず広がった。シャニマスがカナダのアニメコンベンション「Animethon 2026」への出演を発表し、シリーズとして北米初のライブパフォーマンスに挑む。地元では、まねきねこの一室が夏の海辺に様変わりし、七草にちからが水着姿で出迎える。町田では路子ゆかりのマンホールを記念して、喫茶店の一角がコラボドリンクで彩られた。765プロの双子たちのツアーもチケットが動き続けている。大きな幕が下りた翌日にも、小さな扉はいくつも開いている。"
