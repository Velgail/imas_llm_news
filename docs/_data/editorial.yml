# 社説（縦組みコラム）
title: "3つのPOP UPが同時開幕、標ツアーは福井を完走 ── 8月21日"
body: "昨日8月20日は学園アイドルマスター LIVE TOUR「標」福井公演のDAY1で、有村麻央「L'Espoir」・花海佑芽「春と光」の新曲2曲がイントロも明かされないままサプライズ披露された。両曲は本日より配信がスタートし、ツアーは本日福井2日目・千秋楽を迎える。同じ本日8月21日、シンデレラガールズ関連では「幻夏妖宴市」大阪会場・寿屋POP UP「A MAGICAL CHEERS」・JOL Collab Store「Legend of Cinderella～ぴにゃこら太の伝説～」の3会場が一斉に開幕し、SideMもハンズ全国15店舗とのコラボ「knick-knacks Vol.1」を開幕させた。シャニマスでは12月開催「Still blue」の現地チケット当落発表が本日行われ、プラモデル「30 MINUTES LABEL」の新商品発表会も本日18時に控える。予告された予定が次々と現実の開幕日を迎える一日となった。"
