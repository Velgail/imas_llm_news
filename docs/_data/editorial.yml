# 社説（縦組みコラム）
title: "幕が下りる日、続いていく日 ── 大阪千秋楽と、続く物語たち"
body: "今日は「終わり」と「続き」が同じ紙面に並んだ。大阪オリックス劇場では「DERE of the DEAD」が昼夜2公演で千秋楽を迎え、デレステの「LIVE Carnival」も本日20:59に幕を下ろす。一方で秋葉原っぱフェスは10日目、学マスのガシャも10日目、シャニマス「iの栖」は残り3日と、積み重ねの途中にある物語も少なくない。IWSF2026は本日で19日前、映画館のライブビューイング先行抽選もちょうど今日が締め切りだ。何かが終わる瞬間には、必ずまた次の何かが動き出している。SideMの11th STAGEに向けたチケットの列も、今日が申し込みの最終締切。今日という一日は、いくつもの「最後」と「途中」が重なり合う、そんな一日だった。"
