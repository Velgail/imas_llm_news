# 社説（縦組みコラム）
title: "デレステ、本日11周年 ── 9月3日"
body: "本日9月3日、『アイドルマスター シンデレラガールズ スターライトステージ』（デレステ）はサービス開始から11周年を迎えた。記念キャンペーンでは1日1回無料のプラチナオーディションガシャや期間限定アイドル対象のスカウトチケット付きセットが登場し、ログインボーナスやマニー獲得キャンペーンなど盛りだくさんの内容が予定されている。西園寺琴歌役の安齋由香里さんをはじめキャスト陣からも祝福コメントが相次ぎ、ハッシュタグ「#デレステ11周年」はSNSで大きな盛り上がりを見せた。昨日9月2日には、ミリシタが「ミリシタ Extreme 生配信」を実施し、サービス10年目に向けた新シリーズ「X-STREAM THEATER」を発表。アイグラへの新キャラクター追加も決定した一方、14thLIVE（9月19・20日）は円盤化見送りが明らかになった。学マス×Chugai Grace Café リバイバルは本日渋谷モディ店で開幕、アトレ川崎のアイドルマスター オフィシャルショップ出張所は本日最終日を迎える。明日9月4日には、SideM in ダイバーシティ東京 プラザとTeddy's Collection IIが相次いで開幕するほか、総選挙2026「応援投稿祭」もニコニコ動画でスタートする。"
