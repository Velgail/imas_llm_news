# 社説（縦組みコラム）
title: "SideM新キャストお披露目、「かのんくん」トレンド入り ── 9月2日"
body: "本日9月2日の紙面は、まずSideMの話題から。昨日9月1日19時に実施された「特別生配信」で、姫野かのんの新キャスト・伊能幸輝さんが初出演を果たした。配信では今後のボイス収録スケジュールが案内されたほか、9月12・13日開催の「SideM 11th STAGE ～EVER EVER＠FTER～」のテーマが「語り継がれる物語」と発表され、フレグランスブランドAnidealとのコラボも解禁。SNSでは「かのんくん」がトレンド1位となり、伊能さんには「異能バトルくん」の愛称が定着した。西武園ゆうえんちとのコラボ「超!!レトローズパーティ」（10月30日〜12月1日）も昨日新たに発表されている。デレステ10thツアー沖縄・福岡公演のBlu-ray BOXは本日発売、学マス×Chugai Grace Caféリバイバルは明日9月3日に渋谷モディ店で開幕する。ミリシタは本日19時からExtreme生配信を実施し、サービス10年目となる新シリーズの発表を予定している。本日はシンデレラガールズの双葉杏、ミリオンライブの豊川風花が誕生日を迎える。"
