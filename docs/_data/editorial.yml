# 社説（縦組みコラム）
title: "10年の役を、円満に手渡す ── 8月19日"
body: "昨日8月18日、SideM「もふもふえん」の姫野かのんを10年間演じてきた声優・村瀬歩さんが、同役の卒業を発表した。「キャラクターと作品の未来を見据えて双方で話し合った結果、円満な形で卒業が決定した」という言葉には、10年という時間の重みと、それでも前を向く覚悟がにじむ。新キャストは後日発表とのことだが、姫野かのんというキャラクターそのものは、これからも「もふもふえん」の一員として歩き続ける。声優が変わっても、キャラクターの物語は途切れない。それがコンテンツを長く愛される作品にする条件のひとつなのだろう。同じ昨日、シンデレラガールズはTOPPA!!!BASE AKIBAコラボのサテライトショップ5会場を発表し、ミリシタでは矢吹可奈の誕生日を1日限定ガシャで祝い、765プロは新たなちびぐるみを世に送り出した。ひとつの区切りと、いくつもの新しい始まりが同じ日に並ぶ。そして本日8月19日、SideM「Royal Chess Lounge」が名古屋栄で開幕し、シンデレラガールズの木村夏樹が誕生日を迎える。明日にはシャニマス「ちびぐるみ～Team.Sol～」と学マスLIVE TOUR「標」福井公演も控える。区切りの先には、いつも次の一歩がある。"
